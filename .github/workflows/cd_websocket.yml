name: Deploy the websocket
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build image and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.websocket
          push: true
          tags: immohib/docker-to-vm-websocket:${{github.sha}}

      - name: Deploy to the VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: 15.206.159.227
          IMAGE: immohib/docker-to-vm-backend:${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          SSH_KEY_PATH="$(mktemp)"
          echo "$SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"

          ssh -o StrictHostKeyChecking=no -i "$SSH_KEY_PATH" ubuntu@"$DEPLOY_HOST" "
            set -e
            docker pull ${IMAGE}
            docker stop backend || true
            docker rm backend || true
            docker run --name backend -e DATABASE_URL='$DATABASE_URL' -d --restart unless-stopped -p 8080:8080 ${IMAGE}
            docker image prune -f
          "

          rm -f "$SSH_KEY_PATH"
